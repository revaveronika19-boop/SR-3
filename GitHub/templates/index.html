{% extends 'base.html' %}{% block content %}<h1>Онлайн-замовлення книг</h1><p>Відвідувань: {{visits}}. <a href="{{url_for('visit')}}">Збільшити лічильник (session і cookie)</a></p>{% for b in books %}<section><b>{{b.title}}</b> — {{b.author}}, {{b.price}} грн<form action="{{url_for('order')}}" method="post"><input type="hidden" name="book_id" value="{{b.id}}"><input name="customer" placeholder="Ім’я покупця" required><input type="number" name="quantity" min="1" value="1"><button>Замовити</button></form><form action="{{url_for('edit_book',book_id=b.id)}}" method="post"><input name="title" placeholder="Нова назва" required><button>Змінити</button></form><form action="{{url_for('delete_book',book_id=b.id)}}" method="post"><button>Видалити</button></form></section>{% endfor %}<h2>Додати книгу</h2><form action="{{url_for('create_book')}}" method="post"><input name="title" placeholder="Назва" required><input name="author" placeholder="Автор" required><input name="price" type="number" min="1" placeholder="Ціна" required><button>Додати</button></form>{% endblock %}
